version: 2

models:
  - name: int_valutakurs_dag
    description: >
      One EUR/NOK rate per calendar day. Days without a published rate (weekends,
      holidays, today before 16:00) carry the most recent earlier rate forward.
    columns:
      - name: calendar_date
        description: Calendar day.
        data_tests: [not_null, unique]
      - name: eur_nok
        description: NOK per EUR that applies on this day.
        data_tests: [not_null]
      - name: rate_date
        description: The business day the applied rate was published.

  - name: int_pris_vaer_time
    description: >
      Price and weather per bidding zone and hour. 15-minute prices (from October 2025)
      are averaged to hours so they match the hourly temperature observations.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [price_area, hour_start_utc]
    columns:
      - name: price_area
        description: Bidding zone code.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_prisomrade')
                field: price_area
      - name: delivery_date
        description: Norwegian market day the hour belongs to.
        data_tests: [not_null]
      - name: hour_start_utc
        description: Start of the hour (UTC).
        data_tests: [not_null]
      - name: hour_start_local
        description: Start of the hour in Norwegian local time.
      - name: price_eur_mwh
        description: Average day-ahead price in the hour, EUR/MWh.
        data_tests:
          - not_null
          - price_in_reasonable_range
      - name: price_ore_kwh
        description: The same price in øre/kWh, excluding VAT, grid tariffs and fees.
        data_tests: [not_null]
      - name: eur_nok
        description: EUR/NOK rate used for the conversion.
      - name: air_temperature_c
        description: >
          Temperature at the start of the hour in the zone's reference city. Null for
          hours that have not been observed yet, such as tomorrow.
      - name: price_intervals
        description: Number of price intervals in the hour, 1 (hourly) or 4 (15-minute).
        data_tests:
          - accepted_values:
              arguments:
                values: [1, 4]

  - name: int_prognose_features
    description: >
      Features for a next-day price forecast, one row per bidding zone and forecast date D.
      All features are known before the day-ahead auction on D; the target is the
      average price on D+1 (null for the latest date, which is the one to forecast).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [price_area, forecast_date]
      - dbt_utils.expression_is_true:
          arguments:
            expression: "target_date = date_add(forecast_date, 1)"
    columns:
      - name: price_area
        description: Bidding zone code.
        data_tests: [not_null]
      - name: forecast_date
        description: Day D the forecast is made, before the auction at 12:00 CET.
        data_tests: [not_null]
      - name: target_date
        description: Day D+1 the forecast is for.
      - name: price_today
        description: Average price on D (EUR/MWh), published on D-1.
      - name: price_yesterday
        description: Average price on D-1.
      - name: price_same_weekday_last_week
        description: Average price on D-6, the same weekday as D+1 one week earlier.
      - name: price_7d_mean
        description: Mean of the daily average prices D-6..D.
      - name: temperature_morning_c
        description: Mean temperature in the reference city from 00:00 to 10:00 on D.
      - name: target_weekday
        description: Weekday of D+1, 1 = Sunday ... 7 = Saturday.
      - name: target_month
        description: Month of D+1.
      - name: target_day_of_year
        description: Day of year of D+1, a smooth season signal.
      - name: target_is_holiday
        description: Whether D+1 is a Norwegian public holiday.
      - name: reservoir_filling_ratio
        description: Latest reservoir filling NVE had published before D.
      - name: reservoir_vs_earlier_years
        description: That filling minus the mean for the same ISO week in earlier years.
      - name: target_price_eur_mwh
        description: Actual average price on D+1 (EUR/MWh). The value to predict.
