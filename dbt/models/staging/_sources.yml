version: 2

sources:
  - name: bronze
    description: Raw API data loaded into Delta by the daily Databricks job (see ingest/).
    database: dbw_kraftdata
    schema: bronze
    tables:
      - name: entsoe_day_ahead_prices
        description: >
          ENTSO-E day-ahead prices, one row per bidding zone and delivery interval.
          Hourly intervals until February 2025, 15-minute intervals after that.
        config:
          loaded_at_field: _loaded_at
          freshness:
            warn_after: {count: 26, period: hour}
            error_after: {count: 50, period: hour}
      - name: frost_air_temperature
        description: MET Norway hourly 2 m air temperature, one station per bidding zone.
        config:
          loaded_at_field: _loaded_at
          freshness:
            warn_after: {count: 26, period: hour}
            error_after: {count: 50, period: hour}
      - name: norges_bank_eur_nok
        description: Norges Bank daily EUR/NOK exchange rates, one row per business day.
        config:
          loaded_at_field: _loaded_at
          freshness:
            warn_after: {count: 4, period: day}
      - name: nve_reservoir_filling
        description: NVE weekly hydro reservoir filling per bidding zone and for all of Norway.
        config:
          loaded_at_field: _loaded_at
          freshness:
            warn_after: {count: 4, period: day}
