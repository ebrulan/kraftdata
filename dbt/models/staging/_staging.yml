version: 2

models:
  - name: stg_spotpriser
    description: >
      Day-ahead spot prices per bidding zone and delivery interval. All timestamps are UTC
      unless the column name ends in `_local` (Europe/Oslo). `delivery_date` is the
      Norwegian market day.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [price_area, interval_start_utc]
    columns:
      - name: price_area
        description: Bidding zone code.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [NO1, NO2, NO3, NO4, NO5]
          - relationships:
              arguments:
                to: ref('price_areas')
                field: price_area
      - name: delivery_date
        description: Market day in Norwegian local time.
        data_tests: [not_null]
      - name: interval_start_utc
        description: Start of the delivery interval (UTC).
        data_tests: [not_null]
      - name: interval_end_utc
        description: End of the delivery interval (UTC), exclusive.
      - name: interval_start_local
        description: Start of the delivery interval in Norwegian local time (CET/CEST).
      - name: resolution_minutes
        description: Interval length, 60 or 15 minutes.
        data_tests:
          - accepted_values:
              arguments:
                values: [15, 60]
      - name: price_eur_mwh
        description: Day-ahead price in EUR per MWh.
        data_tests:
          - not_null
          - price_in_reasonable_range

  - name: stg_vaer
    description: >
      Hourly 2 m air temperature for one weather station per bidding zone, from MET Norway.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [station_id, observed_at_utc]
    columns:
      - name: station_id
        description: Frost station id.
        data_tests: [not_null]
      - name: city
        description: City the station represents.
      - name: price_area
        description: Bidding zone the station represents.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [NO1, NO2, NO3, NO4, NO5]
      - name: observation_date
        description: Calendar day in Norwegian local time.
        data_tests: [not_null]
      - name: observed_at_utc
        description: Observation time (UTC), value at the full hour.
        data_tests: [not_null]
      - name: observed_at_local
        description: Observation time in Norwegian local time.
      - name: air_temperature_c
        description: Air temperature in degrees Celsius.
        data_tests: [not_null]
      - name: quality_code
        description: MET quality code; 0 means checked and OK, higher values are less certain.

  - name: stg_valutakurser
    description: Norges Bank EUR/NOK rate per business day.
    columns:
      - name: rate_date
        description: Business day the rate was published.
        data_tests: [not_null, unique]
      - name: eur_nok
        description: NOK per EUR.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 5
                max_value: 20

  - name: stg_magasinfylling
    description: >
      Weekly hydro reservoir filling per bidding zone (area NO1-NO5) and for Norway (NO).
      A week is dated by the Sunday that ends it and becomes known on `published_date`.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [area, week_end_date]
    columns:
      - name: area
        description: NO1-NO5 for a bidding zone, NO for the whole country.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["NO", NO1, NO2, NO3, NO4, NO5]  # quoted: YAML reads bare NO as false
      - name: week_end_date
        description: Sunday that ends the ISO week.
        data_tests: [not_null]
      - name: published_date
        description: Date NVE published the value (the Wednesday after the week).
        data_tests: [not_null]
      - name: filling_ratio
        description: Share of reservoir capacity that is filled, 0-1.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1.1
      - name: filling_twh
        description: Stored energy in TWh.
      - name: capacity_twh
        description: Total reservoir capacity in TWh.
