# No secrets here: everything comes from environment variables (.env locally,
# GitHub Actions in CI). dbt finds this file because it is in the project directory.
kraftdata:
  target: dev
  outputs:
    # Local development with a personal access token. Builds into dbt_dev_<layer>.
    dev:
      type: databricks
      host: "{{ env_var('DATABRICKS_HOST') | replace('https://', '') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      token: "{{ env_var('DATABRICKS_TOKEN') }}"
      catalog: dbw_kraftdata
      schema: dbt_dev
      threads: 4

    # GitHub Actions on pull requests. Builds into dbt_ci_<layer>.
    ci:
      type: databricks
      host: "{{ env_var('DATABRICKS_HOST') | replace('https://', '') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      token: "{{ env_var('DATABRICKS_TOKEN') }}"
      catalog: dbw_kraftdata
      schema: dbt_ci
      threads: 4

    # The schemas the dashboard and downstream users read: staging, intermediate, marts.
    prod:
      type: databricks
      host: "{{ env_var('DATABRICKS_HOST') | replace('https://', '') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      token: "{{ env_var('DATABRICKS_TOKEN') }}"
      catalog: dbw_kraftdata
      schema: prod
      threads: 4
