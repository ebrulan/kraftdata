# Databricks Asset Bundle: deploys the repo code and the daily job to the workspace.
#   databricks bundle validate
#   databricks bundle deploy
#   databricks bundle run daily_ingest
#   databricks bundle generate dashboard --resource kraftdata --force   # pull UI edits into the repo
bundle:
  name: kraftdata

variables:
  warehouse_id:
    description: SQL warehouse that runs the dashboard queries
    lookup:
      warehouse: Serverless Starter Warehouse

targets:
  dev:
    default: true
    workspace:
      profile: kraftdata

resources:
  dashboards:
    kraftdata:
      display_name: Kraftdata
      file_path: ./dashboards/kraftdata.lvdash.json
      warehouse_id: ${var.warehouse_id}

  jobs:
    daily_ingest:
      name: kraftdata-daily-ingest
      description: Ingest prices, temperatures, exchange rates and reservoirs, run dbt, forecast tomorrow.
      # Day-ahead prices for the next day are published around 13:00 CET.
      schedule:
        quartz_cron_expression: "0 30 14 * * ?"
        timezone_id: Europe/Oslo
        pause_status: UNPAUSED
      max_concurrent_runs: 1
      tasks:
        - task_key: ingest_prices
          environment_key: default
          spark_python_task:
            python_file: jobs/daily_ingest.py
            parameters: ["--source", "prices", "--repo-root", "${workspace.file_path}"]
          max_retries: 1
          min_retry_interval_millis: 600000
        - task_key: ingest_temperatures
          environment_key: default
          spark_python_task:
            python_file: jobs/daily_ingest.py
            parameters: ["--source", "temperatures", "--repo-root", "${workspace.file_path}"]
          max_retries: 1
          min_retry_interval_millis: 600000
        - task_key: ingest_exchange_rates
          environment_key: default
          spark_python_task:
            python_file: jobs/daily_ingest.py
            parameters: ["--source", "exchange_rates", "--repo-root", "${workspace.file_path}"]
          max_retries: 1
          min_retry_interval_millis: 600000
        - task_key: ingest_reservoirs
          environment_key: default
          spark_python_task:
            python_file: jobs/daily_ingest.py
            parameters: ["--source", "reservoirs", "--repo-root", "${workspace.file_path}"]
          max_retries: 1
          min_retry_interval_millis: 600000
        # Rebuild staging, intermediate and marts once the raw data is in, even if one
        # source failed: dbt tests and source freshness then show what is missing.
        - task_key: dbt_build
          depends_on:
            - task_key: ingest_prices
            - task_key: ingest_temperatures
            - task_key: ingest_exchange_rates
            - task_key: ingest_reservoirs
          run_if: ALL_DONE
          environment_key: dbt
          dbt_task:
            source: WORKSPACE
            project_directory: ${workspace.file_path}/dbt
            commands: ["dbt deps", "dbt build"]
            warehouse_id: ${var.warehouse_id}
            catalog: dbw_kraftdata
            schema: prod
        # Forecast tomorrow with the champion model, then refresh the forecast mart.
        - task_key: forecast_next_day
          depends_on:
            - task_key: dbt_build
          environment_key: ml
          spark_python_task:
            python_file: ml/score_forecast.py
            parameters: ["--zone", "NO2"]
        - task_key: dbt_forecast_mart
          depends_on:
            - task_key: forecast_next_day
          environment_key: dbt
          dbt_task:
            source: WORKSPACE
            project_directory: ${workspace.file_path}/dbt
            commands: ["dbt deps", "dbt build --select fct_prognose"]
            warehouse_id: ${var.warehouse_id}
            catalog: dbw_kraftdata
            schema: prod
      environments:
        - environment_key: default
          spec:
            environment_version: "3"
            dependencies:
              - requests>=2.32
              - python-dotenv>=1.0
        - environment_key: dbt
          spec:
            environment_version: "3"
            dependencies:
              - dbt-databricks>=1.10,<2.0
        # Same versions as the training environment, so the logged model loads unchanged.
        - environment_key: ml
          spec:
            environment_version: "3"
            dependencies:
              - mlflow==3.17.0
              - lightgbm==4.7.0
              - scikit-learn==1.9.1
