# Databricks Asset Bundle: deploys the repo code and the daily job to the workspace.
#   databricks bundle validate
#   databricks bundle deploy
#   databricks bundle run daily_ingest
#   databricks bundle generate dashboard --resource kraftdata --force   # pull UI edits into the repo
bundle:
  name: kraftdata

variables:
  warehouse_id:
    description: SQL warehouse that runs the dashboard queries
    lookup:
      warehouse: Serverless Starter Warehouse

targets:
  dev:
    default: true
    workspace:
      profile: kraftdata

resources:
  dashboards:
    kraftdata:
      display_name: Kraftdata
      file_path: ./dashboards/kraftdata.lvdash.json
      warehouse_id: ${var.warehouse_id}

  jobs:
    daily_ingest:
      name: kraftdata-daily-ingest
      description: Fetch day-ahead prices and temperatures into ADLS raw and load them into bronze.
      # Day-ahead prices for the next day are published around 13:00 CET.
      schedule:
        quartz_cron_expression: "0 30 14 * * ?"
        timezone_id: Europe/Oslo
        pause_status: UNPAUSED
      max_concurrent_runs: 1
      tasks:
        - task_key: ingest_prices
          environment_key: default
          spark_python_task:
            python_file: jobs/daily_ingest.py
            parameters: ["--source", "prices", "--repo-root", "${workspace.file_path}"]
          max_retries: 1
          min_retry_interval_millis: 600000
        - task_key: ingest_temperatures
          environment_key: default
          spark_python_task:
            python_file: jobs/daily_ingest.py
            parameters: ["--source", "temperatures", "--repo-root", "${workspace.file_path}"]
          max_retries: 1
          min_retry_interval_millis: 600000
      environments:
        - environment_key: default
          spec:
            environment_version: "3"
            dependencies:
              - requests>=2.32
              - python-dotenv>=1.0
