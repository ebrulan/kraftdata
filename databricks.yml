# Databricks Asset Bundle: deploys the repo code and the daily job to the workspace.
#   databricks bundle validate
#   databricks bundle deploy
#   databricks bundle run daily_ingest
bundle:
  name: kraftdata

targets:
  dev:
    default: true
    workspace:
      profile: kraftdata

resources:
  jobs:
    daily_ingest:
      name: kraftdata-daily-ingest
      description: Fetch day-ahead prices into ADLS raw and load them into bronze.
      # Day-ahead prices for the next day are published around 13:00 CET.
      schedule:
        quartz_cron_expression: "0 30 14 * * ?"
        timezone_id: Europe/Oslo
        pause_status: UNPAUSED
      max_concurrent_runs: 1
      tasks:
        - task_key: ingest_prices
          environment_key: default
          spark_python_task:
            python_file: jobs/daily_ingest.py
            parameters: ["--repo-root", "${workspace.file_path}"]
          max_retries: 1
          min_retry_interval_millis: 600000
      environments:
        - environment_key: default
          spec:
            environment_version: "3"
            dependencies:
              - requests>=2.32
              - python-dotenv>=1.0
