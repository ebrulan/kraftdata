[project]
name = "kraftdata"
version = "0.1.0"
description = "Data platform for Norwegian electricity spot prices on Azure and Databricks"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "python-dotenv>=1.0",
    "azure-identity>=1.17",
    "azure-storage-file-datalake>=12.16",
]

[dependency-groups]
dbt = [
    "dbt-core>=1.10",
    "dbt-databricks>=1.10",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
ml = [
    "databricks-sql-connector>=4.0",
    "holidays>=0.60",
    "lightgbm>=4.5",
    "mlflow>=3.0",
    "pandas>=2.2",
    "scikit-learn>=1.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
